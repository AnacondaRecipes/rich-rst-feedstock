{% set name = "rich-rst" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f4d117b49697f338769759fa5cacf5197da4888b347b9fda2e50aef5cd8d93bd

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools >=64
  run:
    - python
    - rich >=12.0.0
    - docutils
    - pygments >=2.0.0

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - rich_rst

about:
  home: https://rich-rst.readthedocs.io
  summary: A reStructuredText renderer for rich
  description: |
    Allows rich to print a reStructuredText document in a
    rich format similar to rich.Markdown.
  dev_url: https://github.com/wasi-master/rich-rst
  doc_url: https://rich-rst.readthedocs.io
  license_file: LICENSE
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
