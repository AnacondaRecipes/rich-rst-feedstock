{% set name = "rich-rst" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b1e6a67f8f694a6f36035624bf73e2b1a0a4be13edaf3ba5e654d9758b61073a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - setuptools >=64
  run:
    - python
    - rich >=12.0.0
    - pygments >=2.0.0

test:
  requires:
    - pip
  commands:
    - pip check
  imports:
    - rich_rst

about:
  home: https://rich-rst.readthedocs.io
  summary: A reStructuredText renderer for rich
  description: |
    Allows rich to print a reStructuredText document in a
    rich format similar to rich.Markdown.
  dev_url: https://github.com/wasi-master/rich-rst
  doc_url: https://rich-rst.readthedocs.io
  license_file:
    - LICENSE
    - rich_rst/_vendor/LICENSES.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
